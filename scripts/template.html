<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teenread — {{DATE_SHORT}}</title>
<style>
  :root{color-scheme:light}
  body{background:#faf9f5;color:#1a1a1a;font-family:Georgia,"Times New Roman",serif;margin:0;padding:0 24px 60px;line-height:1.5;font-size:16.5px}
  .wrap{max-width:1100px;margin:0 auto}
  .masthead{text-align:center;border-top:4px double #1a1a1a;border-bottom:1px solid #1a1a1a;margin-top:28px;padding:18px 0 12px}
  .masthead h1{font-size:54px;letter-spacing:1px;margin:0;font-weight:700}
  .masthead p{margin:6px 0 0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
  h2{font-variant:small-caps;font-size:22px;letter-spacing:1px;margin:38px 0 18px;padding:6px 0;border-top:2px solid #1a1a1a;border-bottom:1px solid #1a1a1a}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 32px}
  article{border-bottom:1px solid #1a1a1a;padding:0 0 14px;margin-bottom:16px}
  details summary{cursor:pointer;list-style:none}
  details summary::-webkit-details-marker{display:none}
  h3{font-size:21px;line-height:1.25;margin:0 0 4px}
  summary:hover h3{text-decoration:underline}
  .meta{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:0 0 6px}
  .crux{margin:0}
  .more{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:6px 0 0;text-decoration:underline}
  details[open] .more{display:none}
  .detail{margin-top:12px;padding-top:10px;border-top:1px dotted #1a1a1a}
  .detail p{margin:0 0 10px}
  a{color:#1a1a1a}
  .lead{border-bottom:2px solid #1a1a1a;padding-bottom:18px;margin:26px 0 8px}
  .lead h3{font-size:40px;line-height:1.1}
  .lead .crux{font-size:19px}
  .lead .detail{column-count:2;column-gap:32px}
  .lead .detail p{break-inside:avoid-column}
  .watch ul{margin:0;padding-left:20px}
  .watch li{margin-bottom:8px}
  footer{margin-top:40px;border-top:4px double #1a1a1a;padding-top:10px;text-align:center;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase}
  @media(max-width:700px){.masthead h1{font-size:36px}.lead h3{font-size:28px}.lead .detail{column-count:1}}

  .masthead{position:relative}
  .refresh{position:absolute;top:14px;right:0;text-align:right;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1px;max-width:300px}
  .refresh button{font:inherit;text-transform:uppercase;background:#faf9f5;color:#1a1a1a;border:1px solid #1a1a1a;padding:8px 14px;cursor:pointer}
  .refresh button:hover{background:#1a1a1a;color:#faf9f5}
  .refresh button:disabled{opacity:.5;cursor:default;background:#faf9f5;color:#1a1a1a}
  .refresh .msg{margin-top:6px;letter-spacing:.3px;line-height:1.4}
  .refresh form{margin-top:8px;text-align:left;border:1px solid #1a1a1a;padding:10px;background:#faf9f5}
  .refresh input[type=password]{width:100%;box-sizing:border-box;font-size:16px;padding:6px;border:1px solid #1a1a1a;background:#fff;color:#1a1a1a;margin:6px 0}
  .refresh label.rem{display:block;margin:0 0 8px;letter-spacing:.3px}
  .refresh .link{background:none;border:0;padding:0;text-decoration:underline;text-transform:none;letter-spacing:.3px;cursor:pointer}
  .refresh .link:hover{background:none;color:#1a1a1a}
  @media(max-width:700px){.refresh{position:static;max-width:none;text-align:center;margin-bottom:10px}}
  .masthead p.tag{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:17px;letter-spacing:0;text-transform:none;margin:2px 0 0}
  .detail h4{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin:16px 0 6px;font-weight:700}
  .detail h4:first-child{margin-top:0}
  .detail ul.facts{margin:0 0 10px;padding-left:20px}
  .detail ul.facts li{margin-bottom:5px}
  .detail p.cool,.detail p.think{border-left:3px solid #1a1a1a;padding-left:12px}
  .detail p.think{font-style:italic}
  details[open]>summary .more{display:block;font-size:0;letter-spacing:0}
  details[open]>summary .more::after{content:"Collapse";font-size:11px;letter-spacing:1px}
  .detail .less{margin:14px 0 0}
  .detail .less button{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:#faf9f5;color:#1a1a1a;border:1px solid #1a1a1a;padding:6px 12px;cursor:pointer}
  .detail .less button:hover{background:#1a1a1a;color:#faf9f5}
  .lead .detail h4,.lead .detail ul{break-inside:avoid-column}
  .lead .detail .less{column-span:all}
  .refresh{z-index:2}
  .refresh .msg{background:#faf9f5}
  .archlink{position:absolute;top:14px;left:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#1a1a1a;text-decoration:none;border:1px solid #1a1a1a;padding:8px 14px}
  .archlink:hover{background:#1a1a1a;color:#faf9f5}
  @media(max-width:700px){.archlink{position:static;display:inline-block;margin-bottom:10px}}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <a class="archlink" href="archive/">Archives</a>
  <div class="refresh" id="refresh" hidden>
    <button type="button" id="fetchBtn">Fetch latest reads</button>
    <div class="msg" id="fetchMsg" role="status" aria-live="polite"></div>
    <form id="pwForm" hidden autocomplete="on">
      Enter your refresh password.
      <input type="text" name="username" value="teenread" autocomplete="username" hidden>
      <input type="password" id="pwInput" name="password" autocomplete="current-password" required>
      <label class="rem"><input type="checkbox" id="pwRemember" checked> Remember on this device</label>
      <button type="submit">Unlock &amp; fetch</button>
      <button type="button" class="link" id="pwCancel">Cancel</button>
    </form>
  </div>
  <h1>Teenread</h1>
  <p class="tag">Big ideas for curious minds</p>
  <p>{{DATE_LINE}}</p>
</header>

<!--CONTENT START-->
{{CONTENT}}
<!--CONTENT END-->
<footer>Teenread · Generated {{GENERATED}} by Claude · <a href="archive/">Past editions</a> · Every story links to its source</footer>
</div>
<script>
// Collapse button at the end of every expanded story
document.querySelectorAll('article details').forEach(function(d){
  var det=d.querySelector('.detail'); if(!det) return;
  var p=document.createElement('p'); p.className='less';
  p.innerHTML='<button type="button">Collapse</button>';
  p.firstChild.onclick=function(){
    d.open=false;
    var a=d.closest('article');
    if(a && a.getBoundingClientRect().top<0) a.scrollIntoView({block:'start'});
  };
  det.appendChild(p);
});
</script>
<script>
(function(){
  var OWNER='BejoyKa', REPO='teenread', WF='teenread-refresh.yml', KEY='teenread_gh_token';
  var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/actions/workflows/'+WF;
  var GH_PAGE='https://github.com/'+OWNER+'/'+REPO+'/actions/workflows/'+WF;
  var box=document.getElementById('refresh');
  if(!box || /\/archive\//.test(location.pathname)) return;   // only on today's page
  box.hidden=false;
  var btn=document.getElementById('fetchBtn'), msg=document.getElementById('fetchMsg'),
      form=document.getElementById('pwForm'), pw=document.getElementById('pwInput'),
      remember=document.getElementById('pwRemember');
  var token='';
  function saved(){ try{return localStorage.getItem(KEY)||'';}catch(e){return '';} }
  function save(v){ try{ v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY);}catch(e){} }
  function say(html){ msg.innerHTML=html; }
  function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
  function b64(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); }
  function gh(url,opt){
    opt=opt||{}; opt.headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};
    return fetch(url,opt);
  }
  function stamp(doc){ var f=doc.querySelector('footer'); return f?f.textContent:''; }
  var before=stamp(document);

  async function unlock(password){
    var r=await fetch('refresh-key.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('refresh-key.json is missing from the site');
    var k=await r.json();
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    var aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(k.salt),iterations:k.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    try{
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(k.iv)},aes,b64(k.ct));
    }catch(e){ return ''; }                   // wrong password
    return new TextDecoder().decode(pt);
  }

  function ask(){ form.hidden=false; pw.focus(); }
  document.getElementById('pwCancel').onclick=function(){ form.hidden=true; say(''); };
  form.onsubmit=async function(ev){
    ev.preventDefault();
    say('Unlocking...');
    try{
      var t=await unlock(pw.value);
      if(!t){ say('Wrong password.'); pw.select(); return; }
      token=t; if(remember.checked) save(t);
      pw.value=''; form.hidden=true; run();
    }catch(e){ say('Could not unlock: '+e.message); }
  };
  btn.onclick=function(){ token=token||saved(); token?run():ask(); };

  async function run(){
    btn.disabled=true;
    var t0=Date.now(), since=new Date(t0-60000).toISOString();
    function el(){ var s=Math.round((Date.now()-t0)/1000); return Math.floor(s/60)+'m '+('0'+s%60).slice(-2)+'s'; }
    try{
      say('Starting...');
      var r=await gh(API+'/dispatches',{method:'POST',body:JSON.stringify({ref:'main'})});
      if(r.status===401||r.status===403||r.status===404){
        var why=''; try{ why=(await r.json()).message||''; }catch(e){}
        token=''; save(''); btn.disabled=false;
        say('GitHub refused the token ('+r.status+(why?': '+why.replace(/</g,'&lt;'):'')+'). '+
          (r.status===401?'The token is invalid or expired.':r.status===404?'The token cannot see the teenread repository.':'The token is missing the Actions: Read and write permission on teenread.')+
          ' Make a new token and refresh-key.json.');
        return;
      }
      if(r.status!==204) throw new Error('GitHub said '+r.status);
      var run=null;
      for(var i=0;i<20 && !run;i++){            // find the run we just started
        await sleep(3000);
        var lr=await (await gh(API+'/runs?event=workflow_dispatch&per_page=5&created=%3E%3D'+since)).json();
        run=(lr.workflow_runs||[])[0]||null;
      }
      if(!run) throw new Error('could not find the started run');
      var link=' <a href="'+run.html_url+'" target="_blank" rel="noopener">details</a>';
      while(run.status!=='completed'){
        say('Claude is finding today\'s best reads... '+el()+link+'<br>Usually 3 to 10 minutes.');
        await sleep(10000);
        run=await (await gh(run.url)).json();
      }
      if(run.conclusion!=='success'){
        btn.disabled=false;
        return say('The refresh failed ('+run.conclusion+'). The current edition is unchanged.'+link);
      }
      for(var j=0;j<40;j++){                     // wait for GitHub Pages to publish
        say('Edition written. Publishing the page... '+el());
        await sleep(10000);
        try{
          var html=await (await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'})).text();
          var doc=new DOMParser().parseFromString(html,'text/html');
          if(stamp(doc)&&stamp(doc)!==before){ say('Done. Loading the new edition...'); location.replace(location.pathname+'?t='+Date.now()); return; }
        }catch(e){}
      }
      btn.disabled=false; say('The edition was written but the page has not updated yet. Reload in a minute.');
    }catch(e){
      btn.disabled=false;
      say('Could not refresh: '+e.message+'. You can also <a href="'+GH_PAGE+'" target="_blank" rel="noopener">run it on GitHub</a>.');
    }
  }
  var forget=document.createElement('div');
  forget.innerHTML='<button type="button" class="link">forget on this device</button>';
  forget.firstChild.onclick=function(){ token=''; save(''); say('Forgotten on this device.'); forget.hidden=true; };
  forget.hidden=!saved(); box.appendChild(forget);
})();
</script>
</body>
</html>
